name: Cloudflare deploy
# main push and manual runs only. The repository is public, so secrets are never
# exposed to pull_request events. Nothing touches Cloudflare until
# cloudflare-deploy.json records the D1 database_id and autoDeploy is true
# (docs/cloudflare-deploy.md). Every run also rebuilds the static search
# snapshot from D1; the collection workflow calls this one after a run
# (workflow_call, after_collection: true) so the snapshot follows the catalogue.
# A manual run with preflight: true only reads (time travel, pending
# migrations, the snapshot, catalog_meta) and runs deploy --dry-run; it needs
# the database_id but not autoDeploy or publicOrigin. A push that changes only
# Markdown or docs (the same paths web-checks.yml ignores) does not redeploy;
# the next code push or collection deploys main HEAD with it.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'archives/**']
  workflow_dispatch:
    inputs:
      preflight:
        description: Read-only preflight (no migrations, secrets, upload or deploy)
        type: boolean
        default: false
  workflow_call:
    inputs:
      after_collection:
        description: Called by the collection workflow at the end of its run
        type: boolean
        default: false
# Two locks, always taken in the same order: the catalogue group (outer), then
# the Cloudflare account (inner, shared with d1-setup.yml). The snapshot reads D1
# over many requests, so a push or manual run waits for any collection run. The
# collection workflow holds the catalogue group for its whole run and calls this
# one at its end (after_collection: true); that run takes a group of its own at
# the top, since the catalogue group would wait on its caller, and then the
# account like every other run. Taking the account first here and the catalogue
# second would let a push deploy and a collection's call wait on each other.
# queue: max keeps every waiting run (up to 100, FIFO by waiting time); the
# default keeps one and cancels the older waiting run, so a push deploy could
# cancel a waiting collection or the reverse (PR #48 Codex review).
concurrency:
  group: ${{ inputs.after_collection && 'yukemuri-snapshot-after-collection' || 'yukemuri-catalog-updates' }}
  cancel-in-progress: false
  queue: max
# actions: read only for checked-commit.mjs (after_collection).
permissions:
  contents: read
  actions: read
# bash runs with -eo pipefail: a failing command piped into tee fails its step.
defaults:
  run:
    shell: bash
jobs:
  deploy:
    concurrency:
      group: cloudflare-account
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Wrangler runs from the locked node_modules (4.92.0) with an explicit
    # --config. cloudflare/wrangler-action is not used: its secrets input runs
    # `wrangler secret bulk` without --config, which fails here with "Required
    # Worker name missing", and it picks pnpm from the lockfile.
    env:
      WRANGLER: node_modules/wrangler/bin/wrangler.js
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: gate
        env:
          PREFLIGHT: ${{ inputs.preflight == true }}
        run: node scripts/cloudflare-deploy-gate.mjs >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.mode == 'skip'
        env:
          REASON: ${{ steps.gate.outputs.reason }}
        run: |
          echo "Cloudflare deploy skipped: $REASON" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: steps.gate.outputs.mode != 'skip'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - if: steps.gate.outputs.mode != 'skip'
        run: bash scripts/cloud-setup.sh
      # A snapshot deploy after a collection deploys the commit the collection
      # was dispatched at; a main push already ran the full checks on it. Then
      # building is enough. Otherwise (or when the API cannot tell) check again.
      - if: steps.gate.outputs.mode == 'deploy' && inputs.after_collection
        id: checked
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/checked-commit.mjs | tee -a "$GITHUB_OUTPUT"
      # The same checks as CI, on this exact commit. Its build is what gets deployed,
      # with the collector release pointing at the public Worker.
      - if: steps.gate.outputs.mode == 'deploy' && steps.checked.outputs.checked != 'true'
        env:
          YUKEMURI_SITE_ORIGIN: ${{ steps.gate.outputs.public_origin }}
        run: python3 scripts/cloud-check.py --full
      - if: steps.gate.outputs.mode == 'preflight' || steps.checked.outputs.checked == 'true'
        env:
          YUKEMURI_SITE_ORIGIN: ${{ steps.gate.outputs.public_origin }}
        run: node scripts/run-framework.mjs build
      - if: steps.gate.outputs.mode != 'skip'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          output=$(node "$WRANGLER" d1 time-travel info yukemuri --json --config dist/server/wrangler.json)
          bookmark=$(printf '%s' "$output" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s.slice(s.indexOf("{")));if(!j.bookmark)process.exit(1);console.log(j.bookmark)})')
          echo "D1 restore bookmark before this run: \`$bookmark\`" >> "$GITHUB_STEP_SUMMARY"
      # Preflight: list pending migrations without applying them.
      - if: steps.gate.outputs.mode == 'preflight'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$WRANGLER" d1 migrations list yukemuri --remote --config dist/server/wrangler.json | tee -a "$GITHUB_STEP_SUMMARY"
      - if: steps.gate.outputs.mode == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: 'true'
        run: node "$WRANGLER" d1 migrations apply yukemuri --remote --config dist/server/wrangler.json
      # D06 map positions: the offline geocoder (jageocoder, hash-pinned in
      # scripts/geo/requirements.txt) and its address dictionary, pinned by size
      # and SHA-256 in scripts/geo/pins.json and kept in actions/cache under that
      # hash. Either step may fail without failing the run: the snapshot is then
      # built without geocoded points and says why. Nothing here touches D1.
      - if: steps.gate.outputs.mode != 'skip'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/jageocoder/gaiku_all_20250423_v22.zip
          key: jageocoder-gaiku_all_20250423_v22-31a7551467c209653de62051765442b3ad888530a8dc4e17b8fd123405301653
      - if: steps.gate.outputs.mode != 'skip'
        id: geo
        continue-on-error: true
        env:
          GEO_DIR: ${{ runner.temp }}/jageocoder
        run: bash scripts/geo/prepare.sh | tee -a "$GITHUB_STEP_SUMMARY"
      # The search snapshot (static assets) from the migrated D1: reads only.
      - if: steps.gate.outputs.mode != 'skip'
        id: snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEO_DB: ${{ steps.geo.outputs.db }}
          GEOCODER_PYTHON: ${{ steps.geo.outputs.python }}
          GEO_REASON: ${{ steps.geo.outputs.reason || 'geocoder preparation failed' }}
        run: |
          if [[ -n "$GEO_DB" ]]; then geo=(--geocoder-db "$GEO_DB"); else geo=(--geocoder-skip "$GEO_REASON"); fi
          node scripts/build-search-snapshot.mjs --remote --report snapshot-report.json "${geo[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          id=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("snapshot-report.json","utf8")).manifest.id)')
          [[ "$id" =~ ^[0-9a-f]{16}$ ]] || { echo "No snapshot id in the report"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "prepared=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("snapshot-report.json","utf8")).unprepared.length===0)')" >> "$GITHUB_OUTPUT"
      # Preflight: catalog_meta keys (a read) and what preparing this release
      # would write, from the measured per-step rows.
      - if: steps.gate.outputs.mode == 'preflight'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node "$WRANGLER" d1 execute yukemuri --remote --json --command "SELECT key, value FROM catalog_meta ORDER BY key" --config dist/server/wrangler.json > catalog-meta.json
          node scripts/preflight-report.mjs snapshot-report.json catalog-meta.json | tee -a "$GITHUB_STEP_SUMMARY"
      # Preflight: the same deploy script with --dry-run (a placeholder secret, nothing uploaded).
      - if: steps.gate.outputs.mode == 'preflight'
        run: bash scripts/cloudflare-deploy-worker.sh --dry-run | tee -a "$GITHUB_STEP_SUMMARY"
      # Deploy with the crawl key as the Worker secret (scripts/cloudflare-deploy-worker.sh).
      - if: steps.gate.outputs.mode == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRAWL_ACCESS_KEY: ${{ secrets.YUKEMURI_CRAWL_ACCESS_KEY }}
        run: bash scripts/cloudflare-deploy-worker.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - if: steps.gate.outputs.mode == 'deploy'
        env:
          YUKEMURI_CRAWL_ACCESS_KEY: ${{ secrets.YUKEMURI_CRAWL_ACCESS_KEY }}
          ORIGIN: ${{ steps.gate.outputs.public_origin }}
          SNAPSHOT_ID: ${{ steps.snapshot.outputs.id }}
        run: node scripts/cloudflare-smoke.mjs "$ORIGIN" | tee -a "$GITHUB_STEP_SUMMARY"
      # A release that changes the seed (data/coverage.json, curated hotels) finds
      # D1 unprepared, and public reads no longer seed it (P03). The site above is
      # whole with the snapshot of the current rows; the new Worker then prepares
      # the catalogue through the maintenance path, and the snapshot is built
      # again from the prepared D1 and deployed with the same build.
      - if: steps.gate.outputs.mode == 'deploy' && steps.snapshot.outputs.prepared != 'true'
        env:
          YUKEMURI_CRAWL_ACCESS_KEY: ${{ secrets.YUKEMURI_CRAWL_ACCESS_KEY }}
          ORIGIN: ${{ steps.gate.outputs.public_origin }}
        run: node scripts/cloudflare-prepare.mjs "$ORIGIN" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: steps.gate.outputs.mode == 'deploy' && steps.snapshot.outputs.prepared != 'true'
        id: prepared_snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEO_DB: ${{ steps.geo.outputs.db }}
          GEOCODER_PYTHON: ${{ steps.geo.outputs.python }}
          GEO_REASON: ${{ steps.geo.outputs.reason || 'geocoder preparation failed' }}
        run: |
          if [[ -n "$GEO_DB" ]]; then geo=(--geocoder-db "$GEO_DB"); else geo=(--geocoder-skip "$GEO_REASON"); fi
          node scripts/build-search-snapshot.mjs --remote --require-prepared --report snapshot-report.json "${geo[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          id=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("snapshot-report.json","utf8")).manifest.id)')
          [[ "$id" =~ ^[0-9a-f]{16}$ ]] || { echo "No snapshot id in the report"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.mode == 'deploy' && steps.snapshot.outputs.prepared != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRAWL_ACCESS_KEY: ${{ secrets.YUKEMURI_CRAWL_ACCESS_KEY }}
        run: bash scripts/cloudflare-deploy-worker.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - if: steps.gate.outputs.mode == 'deploy' && steps.snapshot.outputs.prepared != 'true'
        env:
          YUKEMURI_CRAWL_ACCESS_KEY: ${{ secrets.YUKEMURI_CRAWL_ACCESS_KEY }}
          ORIGIN: ${{ steps.gate.outputs.public_origin }}
          SNAPSHOT_ID: ${{ steps.prepared_snapshot.outputs.id }}
        run: node scripts/cloudflare-smoke.mjs "$ORIGIN" | tee -a "$GITHUB_STEP_SUMMARY"
