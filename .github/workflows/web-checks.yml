name: Cloud app checks
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'archives/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'archives/**']
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
# bash runs with -eo pipefail: a failing command piped into tee fails its step.
defaults:
  run:
    shell: bash
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: bash scripts/cloud-setup.sh
      - run: python3 scripts/cloud-check.py --full
