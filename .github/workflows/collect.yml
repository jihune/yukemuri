name: Yukemuri collection
# H01 step 6: collection runs here against the Cloudflare Worker. No cron: a
# public repository's schedule turns off after 60 days without activity, so the
# private runner repository keeps the cron (hourly since C05, every 3 hours
# before) and dispatches this workflow with mode gentle. Until cloudflare-deploy.json records publicOrigin
# (and autoDeploy), a run fails before any request.
run-name: Yukemuri collection (${{ inputs.mode }})
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Operation
        type: choice
        required: true
        default: check-access
        options:
          - check-access
          - gentle
permissions:
  contents: read
  actions: read
# (actions: read passes on to the called deploy.yml for checked-commit.mjs; a
# called workflow gets no more than its caller.)
# The catalogue lock for the whole run, collection and the snapshot deploy it
# calls (P03): runs queue behind each other and behind push deploys, so source
# hosts still see one sequential collector. The called deploy takes its own top
# group and then the Cloudflare account lock; this workflow never takes the
# account lock itself, so both deploy paths take the locks in the same order.
# queue: max on every run in these groups (here, deploy.yml, d1-setup.yml): by
# default a group keeps one waiting run and cancels the older one, so a push
# deploy could cancel a waiting collection or the reverse. With it, waiting runs
# start in order (FIFO by waiting time), up to 100 (docs/cloudflare-deploy.md).
concurrency:
  group: yukemuri-catalog-updates
  cancel-in-progress: false
  queue: max
# bash runs with -eo pipefail: a failing command piped into tee fails its step.
defaults:
  run:
    shell: bash
jobs:
  collect:
    runs-on: ubuntu-24.04
    # A gentle run takes up to 120 pages at about 9-11 seconds each
    # (run-collection.py allows 60 + 11 s a page, 1,380 s for 120 pages).
    timeout-minutes: 26
    outputs:
      pages: ${{ steps.budget.outputs.pages }}
      collected_on: ${{ steps.collected.outputs.day }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify the launcher without credentials
        run: python3 scripts/runner/check_collection.py
      - uses: actions/setup-node@v7
        if: inputs.mode == 'gentle'
        with:
          node-version: '24'
          package-manager-cache: false
      # C03: as many pages as today's free D1 limits allow (at most 120), 16 when
      # usage cannot be read, 0 when the day's budget is used. The Cloudflare
      # token reaches this step only (Account Analytics read, as usage.yml).
      - name: Size the run within the free D1 limits
        id: budget
        if: inputs.mode == 'gentle'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/collection-budget.mjs | tee -a "$GITHUB_OUTPUT"
      - name: Run the Python collector against the Worker
        env:
          YUKEMURI_CRAWL_ACCESS_KEY: ${{ secrets.YUKEMURI_CRAWL_ACCESS_KEY }}
          MODE: ${{ inputs.mode }}
          PAGES: ${{ steps.budget.outputs.pages }}
        run: python3 scripts/runner/run-collection.py --mode "$MODE" --pages "${PAGES:-16}"
      # C07 plan 2: the UTC day the collector finished. The snapshot deploy stores
      # the run's count with it; its build starts minutes later, past midnight at times.
      - name: Note the day the collection finished
        id: collected
        if: inputs.mode == 'gentle'
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
  # No snapshot when the run collected nothing (budget 0): it would only read.
  snapshot:
    needs: collect
    if: inputs.mode == 'gentle' && needs.collect.outputs.pages != '0'
    uses: ./.github/workflows/deploy.yml
    with:
      after_collection: true
      collected_on: ${{ needs.collect.outputs.collected_on }}
    secrets: inherit
